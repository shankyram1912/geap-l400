[project]
name = "stackexchange-agent"
version = "0.1.0"
description = "Stack Exchange search agent: a LangGraph graph self-served over A2A (a2a-sdk 1.x)."

dependencies = [
    # Pure LangGraph graph (deterministic node calls StackExchangeTool; no LLM),
    # self-served over A2A with the official a2a-sdk 1.x. The server advertises a
    # 0.3 interface and enables v0_3 compat (see app/server.py) so the root Code
    # Assist agent's ADK RemoteA2aAgent (a2a-sdk 0.3.x client) can consume it.
    "langgraph>=1.0,<2.0",
    "langchain-community>=0.3.0",
    "stackapi>=0.3.1",
    "a2a-sdk[http-server]>=1.1.0,<2.0",
    "uvicorn>=0.30.0,<1.0.0",
]
requires-python = ">=3.11,<3.14"


[dependency-groups]
dev = [
    "pytest>=9.0.2,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "nest-asyncio>=1.6.0,<2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.4.6,<1.0.0",
    "ty>=0.0.1a0",
    "codespell>=2.2.0,<3.0.0",
]

# Force public PyPI as the default index so `uv lock` produces a lock with
# public URLs even inside the corp Airlock env (whose /etc/uv/uv.toml sets an
# internal default index). This keeps the committed uv.lock buildable outside
# corp (e.g. the Agent Runtime container build).
[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP", # pyupgrade
    "RUF", # ruff specific rules
]
ignore = ["E501", "C901", "B006"] # ignore line too long, too complex

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ty]
# ty is Astral's Rust-based type checker (same team as ruff/uv)
# See: https://docs.astral.sh/ty/

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
exclude = [".venv/**"]

[tool.ty.rules]
# Ignore common issues with third-party libraries and dynamic code patterns
unresolved-import = "ignore"
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
invalid-assignment = "ignore"
invalid-return-type = "ignore"
possibly-missing-attribute = "ignore"
not-subscriptable = "ignore"
deprecated = "ignore"

[tool.codespell]
ignore-words-list = "rouge"
skip = "uv.lock,.venv"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = "."
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel]
packages = ["app"]


